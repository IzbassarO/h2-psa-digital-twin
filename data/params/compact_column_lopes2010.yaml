# "Compact" 2-column PSA unit at LSRE (Porto) — column, feed and cycle of the single-column PSA experiment.
# Source: Lopes (2010) PhD thesis, ch.5. Printed page numbers (PDF page = printed + 34).

column:                          # Table 5.3 p.165
  adsorbent: AC5-KS
  adsorbent_mass: 0.2456         # [kg]
  bed_height: 0.267              # L [m]
  bed_volume: 5.24e-4            # [m3]
  bed_porosity: 0.404            # eps [-]
  internal_diameter: 0.0500      # d_wi [m]  DERIVED: sqrt(4 V / (pi L)) = 0.04999 m
  thermocouples_from_inlet: [0.059, 0.151, 0.239]   # [m]
  bulk_density_check: "m/V = 468.7 kg m-3 vs rho_p (1-eps) = 468.5 kg m-3 (consistent)"

feed:                            # Table 5.4 p.167
  composition: {H2: 0.79, CO2: 0.17, CH4: 0.021, CO: 0.012, N2: 0.007}
  temperature: 303.0             # [K]
  flow_rate_std: 5.00e-5         # [m3 s-1] at 298 K and 1 bar  -> 2.018e-3 mol s-1

cycle_B_experiment:              # Table 5.4 p.167, Figure 5.7 p.166 (single column, 10 steps)
  steps: [Feed, ED1, ED2, ED3, Blow, Purge, EP3, EP2, EP1, Press]
  pressures_bar: {P_high: 5.0, P_inter1: 3.875, P_inter2: 2.75, P_inter3: 1.625, P_low: 0.5}
  times_s: {Feed: 101, ED1: 16, ED2: 16, ED3: 16, Blow: 201, Purge: 40, EP3: 16, EP2: 16, EP1: 16, Press: 21}
  cycle_time_s: 459              # sum of steps; matches Figure 5.18 axis (0-459 s)
  purge_and_press_gas: hydrogen
  initial_state: column filled with He at feed T and P
  boundary_conditions: eq. (5.36)-(5.47) pp.178-180
  pressure_change: exponential decay with rate constant beta_P, eq. (5.39) p.178; value NOT reported
  # ED1-3, Blow: eqs. (5.39)-(5.40); one beta_P for all exponential steps (p.180). EP3-1: eq. (5.45) gives no
  # pressure law; the author's simulated EP pressures are exponential-shaped (Fig. 5.20a p.197), so the same law
  # and beta_P are used. Press: linear, eq. (5.47). beta_P and the purge flow -> fitted: (below).
  ep_inflow: h2                  # EP inflow composition, NOT stated (eq. 5.45 leaves C_inlet open; no text).
                                 #   FROZEN BASELINE (step-3 closure, 2026-10-10): h2 = pure H2, with beta_P =
                                 #   fitted.pressure_decay_rate_author_sims. Scenario: ed = gas collected in the
                                 #   matching ED step (ED1->EP1, ...). The pre-declared step-3 baseline used ed with
                                 #   beta_P = fitted.pressure_decay_rate (pinned in scripts/run_psa.py).
  beta_P_source: pressure_decay_rate_author_sims   # key in fitted: used by default (frozen baseline)
  purge_flow: "NOT reported (pure H2 at z = L); see fitted: below"

performance_definitions: eq. (5.48)-(5.50) p.180   # purity, recovery, productivity

model:                           # pp.167-174
  assumptions: [ideal gas, constant porosity, bi-LDF (macro + micro), axial dispersed plug flow,
                no intraparticle T gradients, no radial gradients, film model for external transfer]
  momentum: Ergun eq. (5.4)
  correlations: Wakao-Funazkri eq. (5.20)-(5.23); Wasch-Froment hw eq. (5.31); Churchill-Chu eq. (5.32)
  original_solver: gPROMS, orthogonal collocation on finite elements, 40 elements, 2 interior points, tol 1e-5

breakthrough_runs:               # fixed-bed breakthrough curves in the compact unit, AC5-KS
  source: Table 5.3 p.165 (conditions), Table 5.7 p.175 (transport parameters of the author's simulations)
  data: Figures 5.15 (runs 1-3) p.188, 5.16 (run 4) p.189, 5.17 (run 5) p.190 -> data/benchmarks/digitized/
  feed_temperature: 323.0        # [K]
  pressure_bar: 5.0              # kept constant with a back-pressure regulator (p.164)
  flow_rate_std: 5.00e-5         # [m3 s-1] at std_conditions
  std_conditions: {T: 298.0, P_bar: 1.0}   # "measured at 298 K and 1 bar" (Table 5.3 footnote)
  initial_state: column filled with He at feed T and P   # eq. (5.16) p.171
  # micropore Dc0/rc2 and Ea printed in Table 5.7 are identical to Table 5.9
  #   -> ac5ks_lopes2010.yaml psa_transport.micropore (errata E3 applies)
  units: {Dax: m2 s-1, lambda: J s-1 m-1 K-1, kf: m s-1, hf: J s-1 m-2 K-1, hw: J s-1 m-2 K-1, U: J s-1 m-2 K-1, Dp: m2 s-1}
  runs:
    1: {y: {H2: 0.70, CO2: 0.30}, Dax: 1.46e-5, lambda: 0.766, kf: 1.83e-2, hf: 123, hw: 55, U: 50,
        Dp: {H2: 7.36e-6, CO2: 7.36e-6}}
    2: {y: {H2: 0.90, CO2: 0.10}, Dax: 1.46e-5, lambda: 1.109, kf: 1.69e-2, hf: 161, hw: 55, U: 50,
        Dp: {H2: 7.36e-6, CO2: 7.36e-6}}
    3: {y: {H2: 0.20, CO2: 0.80}, Dax: 1.46e-5, lambda: 0.296, kf: 2.04e-2, hf: 57, hw: 55, U: 50,
        Dp: {H2: 7.36e-6, CO2: 7.36e-6}}
    4: {y: {H2: 0.70, CO2: 0.26, CO: 0.04}, Dax: 1.37e-5, lambda: 0.778, kf: 1.53e-2, hf: 125, hw: 55, U: 50,
        Dp: {H2: 7.54e-6, CO2: 6.29e-6, CO: 4.26e-6}}
    5: {y: {H2: 0.73, CO2: 0.23, CH4: 0.021, CO: 0.012, N2: 0.007}, Dax: 1.33e-5, lambda: 0.823, kf: 1.40e-2, hf: 130, hw: 55, U: 50,
        Dp: {H2: 7.51e-6, CO2: 6.40e-6, CO: 4.43e-6, CH4: 4.56e-6, N2: 4.38e-6}}

assumed:                         # NOT reported in the thesis — chosen by us, varied in sensitivity analysis
  solid_heat_capacity:  {value: 880.0,  range: [700.0, 1100.0], units: J kg-1 K-1,
                         note: "typical for activated carbon pellets; thesis lists symbol Cp,s but no value"}
  wall_thickness:       {value: 0.003,  range: [0.002, 0.005],  units: m}
  wall_density:         {value: 8000.0, units: kg m-3, note: stainless steel}
  wall_heat_capacity:   {value: 500.0,  units: J kg-1 K-1, note: stainless steel}
  pressure_decay_rate:  {value: null,   range: [0.05, 1.0], units: s-1,
                         note: "beta_P, eq. (5.39); fitted to the pressure history in Figure 5.18a -> fitted:"}
  ambient_temperature:  {value: 303.0, units: K, note: "column heated with flexible heater (Fig. 5.6); PSA runs: = feed temperature (303 K; 323 K in simulations 15-17)"}
  ambient_temperature_breakthrough: {value: 323.0, units: K,
                         note: "heater set to the 323 K run temperature (pp.164, 190-191); the heater switching off at the start of each run (p.191) is not modelled"}
  particle_specific_area: {value: 2.0, range: [2.0, 3.0], units: "1/R_p",
                         note: "a_p = value / R_p. Symbol a_p defined (p.169) but no value; 2/R_p = cylindrical extrudate, consistent with Omega_p = 8"}
  he_macropore_diffusivity: {value: same_as_H2, note: "Table 5.7 gives no He value for the compact runs; He only matters while the initial He is flushed out"}
  isosteric_heat:       {value: constant, note: "(-dH)_i of the virial K_H (Table 5.5) used as the heat of adsorption in eq. (5.8); loading dependence neglected"}

fitted:                          # step 3 (2026-10-09); scripts/fit_psa_bcs.py. Not used: purity, recovery, Table 5.10
  pressure_decay_rate: {value: 0.1998, interval: [0.12, 0.5], units: s-1,
                        data: "Fig. 5.18a cycle-1 pressure history (digitised), steps ED1-3, Blow, EP3-1",
                        objective: "sum over the 7 steps of the mean squared pressure residual (equal step weights); interval: objective <= min x (1 + 1/6)",
                        note: "fitted alone, ED1-3 give 4.5-9.5 s-1 and Blow, EP3-1 0.08-0.12 s-1: one constant (p.180) cannot follow both"}
  pressure_decay_rate_per_step: {ED: 7.33, Blow: 0.078, EP: 0.087, units: s-1,
                        data: "Fig. 5.18a, as pressure_decay_rate; one constant per step type (ED1-3, Blow, EP3-1)",
                        objective: "same objective: 0.048 bar2 (single constant: 1.199); rms per step 0.03-0.16 bar",
                        note: "hypothesis (ii) of the step-3 verification (scripts/fit_psa_bcs.py --no-purge)"}
  pressure_decay_rate_author_sims: {value: 0.102, interval: [0.099, 0.103], units: s-1,
                        data: "Fig. 5.20a (author's simulation 13 at CSS, digitised): ED1-3, Blow, EP3-1; each step alone 0.09-0.11",
                        note: "verification target (author's model), not the experiment; one constant for all exponential steps, EP included"}
  purge_flow:          {value: 0.000261, sd: 3.9e-05, units: mol s-1,
                        data: "Fig. 5.19 1.a, H2 molar flow leaving at z = 0 during the cycle-1 purge (3 GC samples)",
                        objective: "least squares, baseline model (E7 kinetics, taqvi_levan, assumed thermal, group 1-4, N = 30)"}
