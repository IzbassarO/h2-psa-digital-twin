[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h2psa"
version = "1.0.0"
description = "Open digital twin of a layered-bed hydrogen PSA unit with conformal purity guarantees"
readme = "README.md"
requires-python = ">=3.12"          # results produced with Python 3.14.7 (requirements-lock.txt)
license = { text = "MIT" }
authors = [
  { name = "Madina Sissenbay" },
  { name = "Izbassar Orynbassar" },
  { name = "Yessengaly Gilazhov" },
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyyaml>=6.0",
  # analysis (step 6), exact versions frozen with the pre-registration (prereg-v1)
  "scikit-learn==1.9.1",
  "pymoo==0.6.2",
  "statsmodels==0.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
